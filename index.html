  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #07070b;
      background-image: 
        radial-gradient(at 0% 0%, rgba(139, 104, 255, 0.14) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(90, 100, 255, 0.08) 0px, transparent 50%);
    }

    .glass-card {
      background: rgba(19, 17, 26, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      border-color: rgba(172, 137, 255, 0.5);
    }

    .search-input {
      background: rgba(12, 10, 18, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: #b59aff;
      box-shadow: 0 0 15px rgba(139, 104, 255, 0.2);
    }
  
    button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid #b59aff;outline-offset:4px}
    .catalog-toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:24px 0;color:#b3adc5;font-size:14px;flex-wrap:wrap}
    .catalog-toolbar>div{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.catalog-toolbar button,.catalog-toolbar select{background:#17131f;border:1px solid #393046;border-radius:8px;padding:8px 12px;color:#f0eafb}
    #notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#191323;border:1px solid #8063af;padding:14px 22px;border-radius:12px;z-index:100;max-width:90vw;box-shadow:0 10px 40px #0008}
    #cooldownStatus{font-size:14px;color:#c7b6ff;margin-bottom:16px}#resultados h3{overflow-wrap:anywhere}.glass-card .text-\[10px\],.glass-card .text-\[11px\]{font-size:12px}.glass-card summary{gap:12px}.glass-card summary>div{min-width:0}.glass-card summary>span{flex-shrink:0}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  
    .samg-logo{width:64px;height:64px;object-fit:cover;border-radius:14px;border:1px solid #b49aff50;box-shadow:0 0 26px #9170ff26;flex-shrink:0}
    header{background:rgba(8,7,13,.94)!important;border-bottom-color:#a38aff26!important}
    header h1{font-style:italic;letter-spacing:.06em;text-transform:uppercase}
    h2{background:linear-gradient(110deg,#fff 20%,#e5dcff 65%,#a88aff);-webkit-background-clip:text;background-clip:text;color:transparent!important}
    .glass-card{box-shadow:0 10px 30px #0003}.glass-card:hover{box-shadow:0 10px 34px #0005,0 0 20px #9870ff0a}
    @media(max-width:520px){.samg-logo{width:52px;height:52px}header h1{font-size:16px}}
  </style>

  <script>
    const storage={getItem(k){try{return localStorage.getItem(k)}catch{return null}},setItem(k,v){try{localStorage.setItem(k,v)}catch{}},removeItem(k){try{localStorage.removeItem(k)}catch{}}};
    function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    let noticeTimer;function notify(message){const box=document.getElementById('notice');box.textContent=String(message);box.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>box.hidden=true,5000);}
    async function request(url,options={}){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),65000);try{const response=await fetch(url,{...options,headers:{...(options.headers||{}),...(authToken?{Authorization:'Bearer '+authToken}:{})},signal:controller.signal});let data;try{data=await response.json()}catch{throw new Error('El servidor devolvió una respuesta no válida. Intenta de nuevo.')}if(!response.ok){const error=new Error(typeof data.detail==='string'?data.detail:'No se pudo completar la solicitud.');error.status=response.status;error.retryAfter=Number(response.headers.get('Retry-After'))||20;throw error}return data;}finally{clearTimeout(timeout)}}
    const pendingRequests=new Set();let loading=false;
    const API_BASE = "https://api-cuentas-ibva.onrender.com/api";


    let discordUserId = null;
    let authToken='';try{authToken=sessionStorage.getItem('samg_session')||''}catch{}
    let authReady=false;
    let esBooster = false;
    let todasLasCuentas = [];

    // VARIABLES PARA EL COOLDOWN CON PAUSA DE VISIBILIDAD
    let segundosRestantes = 0; let cooldownUntil=0;
    let timerInterval = null;

    async function loginDiscord() {
      try {
        const bytes=crypto.getRandomValues(new Uint8Array(32));
        const verifier=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
        const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
        const challenge=Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');
        const data=await request(`${API_BASE}/auth/start`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge})});
        sessionStorage.setItem('samg_login',JSON.stringify({verifier,state:data.state}));
        window.location.assign(data.url);
      }catch{notify('No se pudo iniciar sesión. Comprueba la conexión y permite el almacenamiento del navegador.');}
    }
    function aplicarBotonBooster() {
      const btn=document.getElementById('discordLoginBtn');
      btn.textContent=authToken&&authReady?(esBooster?'✦ Booster verificado · 0 s':'Discord conectado · 20 s'):'Entrar con Discord';
      btn.style.padding='10px 16px';
      document.getElementById('logoutBtn').hidden=!authToken;
    }
    async function salirDiscord(){
      try{await request(`${API_BASE}/auth/logout`,{method:'POST'});}catch{notify('No se pudo cerrar la sesión en el servidor. Intenta de nuevo.');return;}
      authToken='';esBooster=false;discordUserId=null;sessionStorage.removeItem('samg_session');
      document.querySelectorAll('[id^="pass-container-"]').forEach(el=>el.textContent='');buscarCuentas();aplicarBotonBooster();
    }
    async function chequearEstadoBooster(){
      const params=new URLSearchParams(location.search);const code=params.get('code');
      try{
        if(params.has('error')){history.replaceState({},'',location.pathname);throw new Error('Inicio de sesión cancelado.');}
        if(code){
          const pending=JSON.parse(sessionStorage.getItem('samg_login')||'null');
          history.replaceState({},'',location.pathname);
          sessionStorage.removeItem('samg_login');
          if(!pending||pending.state!==params.get('state'))throw new Error('Inicio de sesión no válido. Vuelve a intentarlo.');
          const data=await request(`${API_BASE}/auth/discord`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,state:pending.state,verifier:pending.verifier})});
          authToken=data.token;sessionStorage.setItem('samg_session',authToken);
        }
        if(authToken){
          const data=await request(`${API_BASE}/auth/me`);discordUserId=data.user_id;esBooster=Boolean(data.es_booster);establecerCooldown(data.retry_after||0);
        }
      }catch(error){
        if(error.status===401){authToken='';sessionStorage.removeItem('samg_session');}
        esBooster=false;notify(error.message);
      }finally{authReady=true;aplicarBotonBooster();}
    }

    async function cargarTodasLasCuentas() {
      if(loading)return;loading=true;document.getElementById('resultCount').textContent='Cargando catálogo…';document.getElementById('resultados').setAttribute('aria-busy','true');
      try {
        const data = await request(`${API_BASE}/cuentas/buscar?juego=`);
        if(!Array.isArray(data.cuentas))throw new Error('Catálogo no válido');
        todasLasCuentas = data.cuentas.filter(c=>c&&Number.isSafeInteger(Number(c.id))).map(c=>({...c,id:Number(c.id),usuario:String(c.usuario??''),juegos:Array.isArray(c.juegos)?[...new Set(c.juegos.filter(j=>typeof j==='string').map(j=>j.trim()).filter(Boolean))]:[]}));
        
        generarCategorias();
        buscarCuentas();
      } catch (err) {
        document.getElementById("resultCount").textContent="No se pudo actualizar el catálogo. Pulsa Actualizar para reintentar.";notify(err.name==='AbortError'?'El servidor está tardando. Intenta de nuevo.':err.message);
      } finally {loading=false;document.getElementById('resultados').setAttribute('aria-busy','false');}
    }

    function generarCategorias() {
      const contexJuegos = Object.create(null);

      todasLasCuentas.forEach(c => {
        c.juegos.forEach(j => {
          const nombreLimpio = j.trim();
          if (nombreLimpio) contexJuegos[nombreLimpio] = (contexJuegos[nombreLimpio] || 0) + 1;
        });
      });

      const categoriasOrdenadas = Object.entries(contexJuegos).sort((a, b) => b[1] - a[1]);
      const catContainer = document.getElementById("categoriasContainer");
      
      if (categoriasOrdenadas.length === 0) {
        catContainer.innerHTML = `<span class="text-xs text-slate-500">No hay categorías disponibles.</span>`;
        return;
      }

      catContainer.innerHTML = categoriasOrdenadas.map(([juego, cantidad]) => `
        <button 
          onclick="filtrarPorCategoria(${escapeHTML(JSON.stringify(juego))})" 
          class="bg-slate-800/80 hover:bg-sky-500/20 hover:border-sky-500/40 border border-slate-700/60 text-slate-300 hover:text-sky-300 text-xs px-3 py-1.5 rounded-xl transition-all flex items-center space-x-1.5 cursor-pointer"
        >
          <span>${escapeHTML(juego)}</span>
          <span class="bg-slate-900 text-sky-400 font-bold text-[10px] px-1.5 py-0.5 rounded-md">${cantidad}</span>
        </button>
      `).join('');
    }

    function filtrarPorCategoria(juego) {
      document.getElementById("searchInput").value = juego;
      buscarCuentas();
    }

    function buscarCuentas() {
      const norm=v=>v.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
      const query = norm(document.getElementById("searchInput").value.trim());
      const filtradas = todasLasCuentas.filter(c => 
        c.juegos.some(j => norm(j).includes(query)) ||
        norm(c.usuario).includes(query)
      );
      const sort=document.getElementById('sortOrder').value;if(sort==='name')filtradas.sort((a,b)=>(a.juegos[0]||'').localeCompare(b.juegos[0]||'','es'));if(sort==='games')filtradas.sort((a,b)=>b.juegos.length-a.juegos.length);
      document.getElementById('resultCount').textContent=filtradas.length+' de '+todasLasCuentas.length+' cuentas';mostrarCuentas(filtradas);
    }

    // --- MANEJO DE COOLDOWN QUE SE PAUSA SI SE CAMBIA DE PESTAÑA ---

    function actualizarInterfazBotones() {
      document.getElementById('cooldownStatus').textContent=segundosRestantes>0?'Próxima solicitud en '+segundosRestantes+' s · tiempo restante del servidor.':'';
      const botones = [...document.querySelectorAll(".btn-revelar-action")].filter(b=>!pendingRequests.has(Number(b.id.replace('btn-revelar-',''))));
      if (segundosRestantes > 0) {
        botones.forEach(b => {
          b.disabled = true;
          b.innerText = `⏱ Espera ${segundosRestantes}s (En pestaña)...`;
        });
      } else {
        botones.forEach(b => {
          b.disabled = false;
          b.innerText = "🔓 Obtener Contraseña";
        });
      }
    }

    function tick(){
      segundosRestantes=Math.max(0,Math.ceil((cooldownUntil-Date.now())/1000));actualizarInterfazBotones();
      if(!segundosRestantes&&timerInterval){clearInterval(timerInterval);timerInterval=null;}
    }
    function iniciarTimer(){if(!timerInterval&&segundosRestantes>0)timerInterval=setInterval(tick,250);}
    function establecerCooldown(segundos){cooldownUntil=Date.now()+Math.max(0,Number(segundos)||0)*1000;tick();iniciarTimer();}
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});

    function mostrarCuentas(cuentas) {
      const resContainer = document.getElementById("resultados");

      if (!cuentas || cuentas.length === 0) {
        resContainer.innerHTML = `
          <div class="col-span-full text-center py-16 bg-slate-900/40 rounded-3xl border border-slate-800">
            <p class="text-lg font-semibold text-slate-300">Sin resultados disponibles</p>
            <p class="text-xs text-slate-500 mt-1">Prueba con otra categoría o nombre.</p>
          </div>
        `;
        return;
      }

      resContainer.innerHTML = cuentas.map((c) => {
        const primerJuego = c.juegos[0] || "Cuenta Multijuego";
        const masJuegos = c.juegos.slice(1);

        return `
          <details class="glass-card rounded-2xl overflow-hidden group">
            <summary class="p-5 flex items-center justify-between cursor-pointer select-none list-none hover:bg-slate-800/40 transition-colors">
              <div class="flex items-center space-x-3">
                <div class="bg-sky-500/10 border border-sky-500/20 p-2 rounded-xl text-sky-400">🎮</div>
                <div>
                  <h3 class="font-bold text-white text-sm sm:text-base group-hover:text-sky-300 transition-colors">
                    ${escapeHTML(primerJuego)}
                  </h3>
                  <p class="text-[11px] text-slate-400">
                    ${masJuegos.length > 0 ? `+${masJuegos.length} juegos extras incluidos` : 'Cuenta individual'}
                  </p>
                </div>
              </div>
              <span class="text-xs text-sky-400 font-semibold bg-sky-500/10 px-2.5 py-1 rounded-lg border border-sky-500/20">
                Ver Datos ▼
              </span>
            </summary>

            <div class="p-5 pt-2 border-t border-slate-800/80 bg-slate-950/40">
              ${masJuegos.length > 0 ? `
                <div class="mb-4">
                  <span class="text-[10px] uppercase font-bold text-slate-500 block mb-1">Otros juegos en la cuenta:</span>
                  <div class="flex flex-wrap gap-1">
                    ${masJuegos.map(j => `<span class="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-md">${escapeHTML(j)}</span>`).join('')}
                  </div>
                </div>
              ` : ''}

              <div class="space-y-3">
                <div>
                  <label class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Usuario</label>
                  <div class="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl px-3 py-2">
                    <span class="font-mono text-xs text-slate-200 truncate pr-2 select-all">${escapeHTML(c.usuario)}</span>
                    <button onclick="copiarTexto(${escapeHTML(JSON.stringify(c.usuario))}, this)" class="text-slate-400 hover:text-sky-400 p-1 cursor-pointer" title="Copiar usuario">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>
                  </div>
                </div>

                <div>
                  <label class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Contraseña</label>
                  <div id="pass-container-${c.id}">
                    <button 
                      id="btn-revelar-${c.id}"
                      onclick="revelarPassword(${c.id})" 
                      ${segundosRestantes > 0 ? 'disabled' : ''}
                      class="btn-revelar-action w-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold py-2 rounded-xl text-xs transition-all shadow-md active:scale-95 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                      ${segundosRestantes > 0 ? `⏱ Espera ${segundosRestantes}s...` : '🔓 Obtener Contraseña'}
                    </button>
                  </div>
                </div>
              </div>

            </div>
          </details>
        `;
      }).join('');

      actualizarInterfazBotones();
      pendingRequests.forEach(id=>{const b=document.getElementById(`btn-revelar-${id}`);if(b){b.disabled=true;b.textContent='Solicitando…'}});
    }

    async function revelarPassword(cuentaId) {
      if(!authReady){notify('Espera a que termine la verificación de sesión.');return;}
      if(!authToken){notify('Inicia sesión con Discord para obtener contraseñas.');return;}
      if(pendingRequests.size){notify("Espera a que termine la solicitud actual.");return;}
      if (segundosRestantes > 0) {
        notify(`Debes permanecer en la página ${segundosRestantes} segundos más antes de solicitar otra contraseña.`);
        return;
      }

      const btn = document.getElementById(`btn-revelar-${cuentaId}`);
      if(!btn)return;pendingRequests.add(cuentaId);btn.disabled = true;
      btn.innerText = "Solicitando...";

      try {
        const data = await request(`${API_BASE}/cuentas/revelar`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            cuenta_id: cuentaId
          })
        });

        if (data.success && data.password != null) {
          const container = document.getElementById(`pass-container-${cuentaId}`);
          if(container)container.innerHTML = `
            <div class="flex items-center justify-between bg-slate-950 border border-emerald-500/40 rounded-xl px-3 py-2">
              <span class="font-mono text-xs text-emerald-400 truncate pr-2 select-all">${escapeHTML(data.password)}</span>
              <button onclick="copiarTexto(${escapeHTML(JSON.stringify(String(data.password)))}, this)" class="text-slate-400 hover:text-emerald-400 p-1 cursor-pointer" title="Copiar contraseña">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
              </button>
            </div>
          `;

          esBooster=Boolean(data.es_booster);aplicarBotonBooster();establecerCooldown(data.cooldown_seconds);
        } else {
          establecerCooldown(20);
          notify(data.detail || "Debes esperar antes de obtener otra contraseña.");
        }
      } catch (err) {
        if(err.status===429)establecerCooldown(err.retryAfter);
        if(err.status===401){authToken='';esBooster=false;sessionStorage.removeItem('samg_session');aplicarBotonBooster();}
        notify(err.name==='AbortError'?'La solicitud tardó demasiado. Intenta de nuevo.':err.message);
      } finally {pendingRequests.delete(cuentaId);actualizarInterfazBotones();}
    }

    async function copiarTexto(texto, btn) {
      try {await navigator.clipboard.writeText(String(texto));const original=btn.innerHTML;btn.textContent='✓';btn.setAttribute('aria-label','Copiado');setTimeout(()=>{btn.innerHTML=original;btn.setAttribute('aria-label',btn.title)},1200);}catch{notify('No se pudo copiar. Selecciona el texto y cópialo manualmente.');}
    }

    chequearEstadoBooster();
    cargarTodasLasCuentas();


  </script>
</body>
</html>
